# JîrCode — Dokploy Compose (Traefik labels + dokploy-network)

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string-at-least-50-chars}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-jircode.com,www.jircode.com}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://jircode.com,https://www.jircode.com}
      CANONICAL_HOST: ${CANONICAL_HOST:-}
      SITE_EMAIL: ${SITE_EMAIL:-hello@jircode.com}
      SITE_LOCATION: ${SITE_LOCATION:-Türkiye}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL}
      SEED_PROJECTS: ${SEED_PROJECTS:-True}
      SEED_MENUS: ${SEED_MENUS:-True}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@jircode.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-changeme-please}
    volumes:
      - media_data:/app/media
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # www + apex
      - traefik.http.routers.jircode.rule=Host(`www.jircode.com`) || Host(`jircode.com`)
      - traefik.http.routers.jircode.entrypoints=websecure
      - traefik.http.routers.jircode.tls=true
      - traefik.http.routers.jircode.tls.certresolver=letsencrypt
      - traefik.http.routers.jircode.service=jircode
      - traefik.http.services.jircode.loadbalancer.server.port=8000

      # HTTP -> HTTPS
      - traefik.http.routers.jircode-http.rule=Host(`www.jircode.com`) || Host(`jircode.com`)
      - traefik.http.routers.jircode-http.entrypoints=web
      - traefik.http.routers.jircode-http.middlewares=jircode-https
      - traefik.http.middlewares.jircode-https.redirectscheme.scheme=https
      - traefik.http.middlewares.jircode-https.redirectscheme.permanent=true

volumes:
  media_data:

networks:
  dokploy-network:
    external: true
