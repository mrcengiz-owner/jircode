# JîrCode — Dokploy
#
# ÖNEMLİ:
# 1) Dokploy → Domains sekmesinden jircode.com ve www.jircode.com KAYITLARINI SİL
#    (Dokploy'un ürettiği ayrık *-web / *-websecure service label'ları 404 yapabiliyor)
# 2) Bu compose'taki Traefik label'ları kullanılacak
# 3) Redeploy

services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-jircode.com,www.jircode.com}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://jircode.com,https://www.jircode.com}
      CANONICAL_HOST: ${CANONICAL_HOST:-}
      SITE_EMAIL: ${SITE_EMAIL:-hello@jircode.com}
      SITE_LOCATION: ${SITE_LOCATION:-Türkiye}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      SEED_PROJECTS: ${SEED_PROJECTS:-True}
      SEED_MENUS: ${SEED_MENUS:-True}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@jircode.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-changeme-please}
    volumes:
      - media_data:/app/media
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # Tek servis — hem apex hem www
      - traefik.http.services.jircode-web.loadbalancer.server.port=8000

      # HTTPS
      - traefik.http.routers.jircode-web.rule=Host(`www.jircode.com`) || Host(`jircode.com`)
      - traefik.http.routers.jircode-web.entrypoints=websecure
      - traefik.http.routers.jircode-web.tls=true
      - traefik.http.routers.jircode-web.tls.certresolver=letsencrypt
      - traefik.http.routers.jircode-web.service=jircode-web

      # HTTP → HTTPS (Dokploy file middleware)
      - traefik.http.routers.jircode-web-http.rule=Host(`www.jircode.com`) || Host(`jircode.com`)
      - traefik.http.routers.jircode-web-http.entrypoints=web
      - traefik.http.routers.jircode-web-http.middlewares=redirect-to-https@file
      - traefik.http.routers.jircode-web-http.service=jircode-web

volumes:
  media_data:

networks:
  dokploy-network:
    external: true
